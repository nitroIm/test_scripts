name: Market Scanner Report

on:
  workflow_dispatch: # Ручной запуск кнопкой
  repository_dispatch:
    types: [run_report] # Для внешнего крона

permissions:
  contents: read # Нам нужно только читать файл, пушить ничего не надо

jobs:
  send-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10' # Версия Python зафиксирована

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests==2.32.3 # Версия библиотеки зафиксирована

      - name: Run Report Bot
        env:
          INVEST_BOT_TOKEN: ${{ secrets.INVEST_BOT_TOKEN }}
          INVEST_BOT_CHAT_ID: ${{ secrets.INVEST_BOT_CHAT_ID }}
        run: python t_invest/reports/market_scanner_report.py

      # === БЛОК УВЕДОМЛЕНИЯ ОБ ОШИБКЕ ===
      - name: Notify Telegram on Failure
        if: failure()
        env:
          TELEGRAM_TOKEN: ${{ secrets.INVEST_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.INVEST_BOT_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
          --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
          --data-urlencode "text=🚨 ВНИМАНИЕ! Бот-репортер упал! 🚨%0AСсылка на логи: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"