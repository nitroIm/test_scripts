name: Hamster Recon

on:
  workflow_dispatch:

permissions:
  contents: write # Разрешаем Actions сохранять файлы в репозиторий

jobs:
  run-hamster:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install playwright
          playwright install chromium

      - name: Run Hamster Script
        run: python Hamster/hamster.py

      - name: Commit and push screenshot
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add Hamster/telegram_web.png || echo "No file"
          git commit -m "Add screenshot [skip ci]" || echo "No changes to commit"
          git push || echo "Push failed"