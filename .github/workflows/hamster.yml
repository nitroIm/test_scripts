name: Hamster Recon

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-hamster:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install playwright telethon
          playwright install chromium

      - name: Run Hamster Script
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
        run: python Hamster/hamster.py

      - name: Commit debug files
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add Hamster/ || echo "No files"
          git commit -m "Add game debug data [skip ci]" || echo "No changes to commit"
          git push || echo "Push failed"