name: Hamster King Auto

on:
  workflow_dispatch:
  # schedule:
  #   - cron: '0 12 * * *' # Раз в сутки (позже раскомментируем)

jobs:
  run-hamster-king:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install playwright
          playwright install chromium

      - name: Run Hamster King Script
        env:
          TG_SESSION: ${{ secrets.TG_SESSION }} # Позже понадобится для входа
        run: python Hamster/hamster_king.py