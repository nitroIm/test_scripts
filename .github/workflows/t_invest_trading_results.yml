name: T-Invest Trading Results

on:
  workflow_dispatch: # Только ручной запуск или внешний триггер

jobs:
  send-results:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests==2.32.3 matplotlib==3.8.4 numpy==1.26.4
          
      - name: Run Script
        env:
          INVEST_BOT_TOKEN: ${{ secrets.INVEST_BOT_TOKEN }}
          TG_T_INVEST_CHANNEL: ${{ secrets.TG_T_INVEST_CHANNEL }}
        run: |
          python t_invest/reports/bot_t_invest/t_invest_trading_results.py