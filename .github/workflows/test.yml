name: Test Telegram

on:
  workflow_dispatch:

jobs:
  test-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install requests
        run: pip install requests==2.32.3

      - name: Run Test Script
        env:
          INVEST_BOT_TOKEN: ${{ secrets.INVEST_BOT_TOKEN }}
          TG_T_INVEST_CHANNEL: ${{ secrets.TG_T_INVEST_CHANNEL }}
        run: python t_invest/reports/bot_t_invest/test.py