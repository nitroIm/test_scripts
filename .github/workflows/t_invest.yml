name: T-Invest Full Test

on:
  workflow_dispatch: # Кнопка для ручного запуска
  # schedule:
   # - cron: '0 */6 * * *' # Запуск каждые 6 часов

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install t-tech-investments --index-url https://opensource.tbank.ru/api/v4/projects/238/packages/pypi/simple

      - name: Run script
        env:
          T_INVEST_TOKEN: ${{ secrets.T_INVEST_TOKEN }}
        run: python t_invest.py