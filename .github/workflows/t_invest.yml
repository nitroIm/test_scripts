name: T-Invest Test

on:
  workflow_dispatch: # Только ручной запуск кнопкой

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        env:
          SSL_TBANK_VERIFY: 'True' # Включаем встроенный сертификат МинЦифры
        run: |
          python -m pip install --upgrade pip
          pip install t-tech-investments --index-url https://opensource.tbank.ru/api/v4/projects/238/packages/pypi/simple --trusted-host opensource.tbank.ru

      - name: Run script
        env:
          T_INVEST_TOKEN: ${{ secrets.T_INVEST_TOKEN }}
          SSL_TBANK_VERIFY: 'True' # Дублируем для самого скрипта, чтобы не было ошибок при запросах
        run: python t_invest.py