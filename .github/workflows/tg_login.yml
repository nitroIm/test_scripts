name: Telegram Login

on:
  workflow_dispatch:

jobs:
  login:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: pip install -r requirements.txt
        
      - name: Run Login Script
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          MY_PHONE: ${{ secrets.MY_PHONE }}
          TG_CODE: ${{ secrets.TG_CODE }}
          TG_HASH: ${{ secrets.TG_HASH }}
          TEMP_SESSION: ${{ secrets.TEMP_SESSION }}
          TG_2FA_PASSWORD: ${{ secrets.TG_2FA_PASSWORD }}
        run: python scripts/tg_login.py