name: T-Invest News Collector

on:
  workflow_dispatch:
  repository_dispatch:
    types: [run_news_collector]

permissions:
  contents: write

jobs:
  collect-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        env:
          SSL_TBANK_VERIFY: 'True'
        run: |
          python -m pip install --upgrade pip
          # Обновляем версию до 1.51.0, где есть метод news()
          pip install t-tech-investments==1.51.0 --index-url https://opensource.tbank.ru/api/v4/projects/238/packages/pypi/simple --trusted-host opensource.tbank.ru

      - name: Run news collector
        env:
          T_INVEST_TOKEN: ${{ secrets.T_INVEST_TOKEN }}
          SSL_TBANK_VERIFY: 'True'
        run: python t_invest/news/t_invest_news_collector.py

      - name: Commit and push news
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add t_invest/data/news/t_invest_news_collector.json || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update news $(date -u +'%Y-%m-%d %H:%M')" && git pull --rebase origin main && git push)