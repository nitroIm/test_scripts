name: T-Invest News Collector + Sentiment

on:
  workflow_dispatch:
  repository_dispatch:
    types: [run_news_collector]

permissions:
  contents: write

jobs:
  collect-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests==2.32.3

      - name: Run news collector
        env:
          T_INVEST_TOKEN: ${{ secrets.T_INVEST_TOKEN }}
        run: python t_invest/news/t_invest_news_collector.py

      - name: Run sentiment engine
        run: python t_invest/news/t_invest_sentiment.py

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add t_invest/data/news/ || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update news & sentiment $(date -u +'%Y-%m-%d %H:%M')" && git pull --rebase origin main && git push)