name: Market Scanner (PROD)

on:
  workflow_dispatch:
  repository_dispatch:
    types: [run_scanner]

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10' # Версия Python зафиксирована

      - name: Install dependencies
        env:
          SSL_TBANK_VERIFY: 'True'
        run: |
          python -m pip install --upgrade pip
          # Версия библиотеки зафиксирована
          pip install t-tech-investments==1.49.3 --index-url https://opensource.tbank.ru/api/v4/projects/238/packages/pypi/simple --trusted-host opensource.tbank.ru

      - name: Run scanner
        env:
          T_INVEST_TOKEN: ${{ secrets.T_INVEST_TOKEN }} # PROD-токен
          SSL_TBANK_VERIFY: 'True'
        run: python t_invest/scanner/market_scanner.py

      - name: Commit and push results
        if: success() # Коммитим только если сканер успешно отработал
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add t_invest/data/scanner/whitelist.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update whitelist $(date -u +'%Y-%m-%d %H:%M')" && git push)

      # === БЛОК УВЕДОМЛЕНИЯ ОБ ОШИБКЕ ===
      - name: Notify Telegram on Failure
        if: failure() # Сработает, только если любой из шагов выше упал
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
          --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
          --data-urlencode "text=🚨 ВНИМАНИЕ! Сканер Market Scanner упал! 🚨%0AПроект: ${{ github.repository }}%0AВетка: ${{ github.ref_name }}%0AСсылка на логи: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"