name: T-invest Simulate

on:
  workflow_dispatch: # Для ручного запуска

concurrency:
  group: simulator-run
  cancel-in-progress: false

jobs:
  simulate:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Важно для пуша изменений
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install t-tech-investments==1.49.3 --index-url https://opensource.tbank.ru/api/v4/projects/238/packages/pypi/simple --trusted-host opensource.tbank.ru
          pip install pandas==2.2.3 numpy==1.26.4 scikit-learn==1.6.1 joblib==1.4.2 requests==2.32.3
          pip install xgboost==2.1.4 lightgbm==4.5.0 catboost==1.2.7

      - name: Run Simulator
        env:
          T_INVEST_TOKEN: ${{ secrets.T_INVEST_TOKEN }}
          INVEST_BOT_TOKEN: ${{ secrets.INVEST_BOT_TOKEN }}
          INVEST_BOT_CHAT_ID: ${{ secrets.INVEST_BOT_CHAT_ID }}
          SSL_TBANK_VERIFY: True
        run: |
          python t_invest/simulator/t_invest_simulator.py

      - name: Commit and Push State
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add t_invest/data/simulator/
          # Проверяем, есть ли изменения, и если есть - коммитим
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update simulator state $(date -u +'%Y-%m-%d %H:%M')")
          # Подтягиваем изменения (если кто-то успел запушить) и пушим
          git pull --rebase origin main
          git push