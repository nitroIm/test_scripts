name: T-Invest Learn Pipeline

on:
  workflow_dispatch:
  repository_dispatch:
    types: [run_learn]

permissions:
  contents: write

jobs:
  learn:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        env:
          SSL_TBANK_VERIFY: 'True'
        run: |
          python -m pip install --upgrade pip
          pip install t-tech-investments==1.49.3 --index-url https://opensource.tbank.ru/api/v4/projects/238/packages/pypi/simple --trusted-host opensource.tbank.ru
          pip install pandas==2.2.3 numpy==1.26.4 scikit-learn==1.6.1 joblib==1.4.2 requests==2.32.3
          pip install xgboost==2.1.4 lightgbm==4.5.0 catboost==1.2.7

      - name: Run learning pipeline
        env:
          T_INVEST_TOKEN: ${{ secrets.T_INVEST_TOKEN }}
          INVEST_BOT_TOKEN: ${{ secrets.INVEST_BOT_TOKEN }}
          INVEST_BOT_CHAT_ID: ${{ secrets.INVEST_BOT_CHAT_ID }}
          SSL_TBANK_VERIFY: 'True'
        # ПУТЬ ИСПРАВЛЕН НА t_invest/learn/t_invest_learn.py
        run: python t_invest/learn/t_invest_learn.py

      - name: Commit and push new model
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add t_invest/data/model/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update best model $(date -u +'%Y-%m-%d %H:%M')" && git push)

      - name: Notify Telegram on Failure
        if: failure()
        env:
          TG_TOKEN: ${{ secrets.INVEST_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.INVEST_BOT_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
          --data-urlencode "chat_id=${TG_CHAT}" \
          --data-urlencode "text=🚨 Обучение упало! Ссылка: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"