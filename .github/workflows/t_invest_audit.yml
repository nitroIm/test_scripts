name: T-Invest Audit

on:
  workflow_dispatch: # Для ручного теста

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests==2.32.3

      - name: Run Audit Script
        env:
          INVEST_BOT_TOKEN: ${{ secrets.INVEST_BOT_TOKEN }}
          INVEST_BOT_CHAT_ID: ${{ secrets.INVEST_BOT_CHAT_ID }}
        run: |
          python t_invest/audit/run_audit.py

      - name: Commit audit config
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin main || true
          git add t_invest/data/simulator/simulator_config.json
          git diff --cached --quiet || (git commit -m "T-INVEST: audit config updated [skip ci]" && git push)
