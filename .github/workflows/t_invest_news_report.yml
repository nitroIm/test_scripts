name: T-Invest News Report

on:
  workflow_dispatch: # Для ручного теста

jobs:
  send-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests==2.32.3 matplotlib==3.8.4 numpy==1.26.4
          
      - name: Run Script
        env:
          # ВАЖНО: Тут отправляем в ЛИЧКУ (INVEST_BOT_CHAT_ID), а не в канал
          INVEST_BOT_TOKEN: ${{ secrets.INVEST_BOT_TOKEN }}
          INVEST_BOT_CHAT_ID: ${{ secrets.INVEST_BOT_CHAT_ID }}
        run: |
          python t_invest/reports/bot_t_invest/t_invest_news_report.py